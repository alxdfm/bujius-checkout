<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Bujius Checkout: how a split payment flows</title>
  <desc id="d">The payer's wallet asks the store's transaction request handler for a transaction, signs and sends it to Solana devnet, where the bujius_checkout program pays the merchant and every partner in one transaction. The store's verifier then reads the chain to confirm the amount. An optional hosted service wraps the same flow.</desc>
  <style>
    :root { --bg:#ffffff; --box:#f4f6f8; --line:#5b6770; --text:#1b2530; --muted:#5b6770; --accent:#0b7a5a; --accent-bg:#e3f4ee; --dash:#9aa5ae; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1519; --box:#18222a; --line:#8c9aa5; --text:#e8edf1; --muted:#9fb0bc; --accent:#4cd2a4; --accent-bg:#12342b; --dash:#5d6c77; }
    }
    .bg { fill:var(--bg); }
    .box { fill:var(--box); stroke:var(--line); stroke-width:1.2; }
    .chain { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
    .hosted { fill:none; stroke:var(--dash); stroke-width:1.4; stroke-dasharray:6 5; }
    .arrow { stroke:var(--line); stroke-width:1.6; fill:none; marker-end:url(#head); }
    .title { font-size:15px; font-weight:600; fill:var(--text); }
    .sub { font-size:12px; fill:var(--muted); }
    .code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11.5px; fill:var(--text); }
    .step { font-size:11.5px; fill:var(--text); }
    .strong { font-size:13px; font-weight:600; fill:var(--accent); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="570"/>

  <!-- Payer's wallet -->
  <rect class="box" x="30" y="60" width="210" height="120" rx="10"/>
  <text class="title" x="46" y="88">Payer's wallet</text>
  <text class="sub" x="46" y="110">phone, by scanning the QR</text>
  <text class="sub" x="46" y="128">browser, with PayButton</text>
  <text class="code" x="46" y="156">signs and sends</text>

  <!-- Store backend -->
  <rect class="box" x="370" y="60" width="240" height="120" rx="10"/>
  <text class="title" x="386" y="88">Your store backend</text>
  <text class="code" x="386" y="112">createTransaction-</text>
  <text class="code" x="386" y="127">RequestHandler</text>
  <text class="sub" x="386" y="152">resolve(order) gives the amount</text>
  <text class="sub" x="386" y="168">and the reference; never a wallet</text>

  <!-- Verifier -->
  <rect class="box" x="370" y="250" width="240" height="120" rx="10"/>
  <text class="title" x="386" y="278">Verifier (SDK)</text>
  <text class="code" x="386" y="302">findPayment(reference)</text>
  <text class="code" x="386" y="318">verifySplitPayment</text>
  <text class="sub" x="386" y="342">paid · paid_late · invalid</text>
  <text class="sub" x="386" y="358">judged by balances, not by a callback</text>

  <!-- Solana devnet -->
  <rect class="chain" x="680" y="40" width="250" height="330" rx="12"/>
  <text class="title" x="696" y="66">Solana devnet</text>
  <rect class="box" x="696" y="80" width="218" height="64" rx="8"/>
  <text class="code" x="710" y="104">bujius_checkout</text>
  <text class="sub" x="710" y="124">pay(amount): one transaction,</text>
  <text class="sub" x="710" y="138">no account per sale</text>
  <rect class="box" x="696" y="160" width="218" height="64" rx="8"/>
  <text class="code" x="710" y="184">SplitConfig (immutable)</text>
  <text class="sub" x="710" y="204">token + partners with bps,</text>
  <text class="sub" x="710" y="218">audited on-chain</text>
  <text class="sub" x="712" y="246">pays, atomically:</text>
  <rect class="box" x="696" y="254" width="218" height="26" rx="6"/>
  <text class="step" x="710" y="272">Merchant: the remainder</text>
  <rect class="box" x="696" y="288" width="218" height="26" rx="6"/>
  <text class="step" x="710" y="306">Partner: floor(amount × bps / 10 000)</text>
  <rect class="box" x="696" y="322" width="218" height="26" rx="6"/>
  <text class="step" x="710" y="340">Platform: floor(amount × bps / 10 000)</text>
  <line class="arrow" x1="805" y1="144" x2="805" y2="160"/>
  <line class="arrow" x1="805" y1="224" x2="805" y2="236"/>

  <!-- Arrows -->
  <line class="arrow" x1="240" y1="95" x2="370" y2="95"/>
  <text class="step" x="250" y="87">① GET · POST</text>
  <line class="arrow" x1="370" y1="146" x2="240" y2="146"/>
  <text class="step" x="262" y="164">② transaction</text>
  <path class="arrow" d="M135 180 V218 H680"/>
  <text class="step" x="146" y="212">③ the wallet signs and sends it to the chain</text>
  <line class="arrow" x1="490" y1="180" x2="490" y2="250"/>
  <text class="step" x="500" y="244">④ is it paid?</text>
  <line class="arrow" x1="610" y1="310" x2="680" y2="310"/>
  <text class="step" x="618" y="302">⑤ reads</text>

  <!-- Hosted service -->
  <rect class="hosted" x="30" y="412" width="900" height="112" rx="12"/>
  <text class="title" x="48" y="440">Optional: the hosted service (apps/hosted), for a store that runs none of this</text>
  <rect class="box" x="48" y="456" width="268" height="52" rx="8"/>
  <text class="code" x="62" y="478">POST /v1/charges</text>
  <text class="sub" x="62" y="496">strict body; the payout comes from the config</text>
  <rect class="box" x="346" y="456" width="268" height="52" rx="8"/>
  <text class="code" x="360" y="478">Checkout page /c/:id</text>
  <text class="sub" x="360" y="496">QR, pay button, status by itself</text>
  <rect class="box" x="644" y="456" width="268" height="52" rx="8"/>
  <text class="code" x="658" y="478">Signed webhook</text>
  <text class="sub" x="658" y="496">one attempt, a delivery log, a resend route</text>

  <text class="strong" x="30" y="552">The program guarantees the split. The verifier guarantees the amount.</text>
</svg>
